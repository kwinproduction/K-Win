<html lang="si">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
    --primary-red:#ff1a1a;
    --primary-gradient:linear-gradient(135deg,#ff1a1a 0%,#990000 100%);
    --dark-bg:#060606;
    --dark-card:rgba(20,20,20,0.55);
    --text-main:#ffffff;
    --text-muted:#a3a3a3;
    --border-glow:rgba(255,26,26,0.2);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    overflow-x:hidden;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--dark-bg);
    color:var(--text-main);
    overflow-x:hidden;
    line-height:1.6;
    position:relative;
    width:100%;
}

/* GLOW */

body::before,
body::after{
    content:'';
    position:absolute;
    width:380px;
    height:380px;
    border-radius:50%;
    background:rgba(255,26,26,0.06);
    filter:blur(140px);
    z-index:-1;
    pointer-events:none;
}

body::before{
    top:20%;
    left:-120px;
}

body::after{
    bottom:25%;
    right:-120px;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#0a0a0a;
}

::-webkit-scrollbar-thumb{
    background:var(--primary-gradient);
    border-radius:10px;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;

    padding:18px 5%;

    background:rgba(6,6,6,0.75);

    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,0.03);
}

.nav-logo-link{
    display:flex;
    align-items:center;
    text-decoration:none;
    flex-shrink:0;
}

.nav-logo-img{
    width:46px;
    height:46px;
    object-fit:cover;
    border-radius:10px;

    border:1px solid rgba(255,255,255,0.1);

    transition:0.3s ease;
}

.nav-logo-img:hover{
    transform:scale(1.05);
}

.nav-links{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
}

.nav-links a{
    text-decoration:none;
    color:var(--text-muted);

    font-size:0.95rem;
    font-weight:500;

    position:relative;

    transition:0.3s ease;
}

.nav-links a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:-5px;
    width:0;
    height:2px;
    background:var(--primary-red);
    transition:0.3s ease;
}

.nav-links a:hover::after,
.nav-links a.active::after{
    width:100%;
}

.nav-links a:hover,
.nav-links a.active{
    color:#fff;
}

/* HEADER */

.gallery-header{
    text-align:center;

    padding:180px 20px 60px;

    background:
    linear-gradient(rgba(6,6,6,0.55),var(--dark-bg));
}

.gallery-header h1{
    font-family:'Montserrat',sans-serif;
    font-size:clamp(2rem,8vw,4rem);
    font-weight:900;

    margin-bottom:14px;

    line-height:1.2;

    animation:fadeInDown .8s ease;
}

.gallery-header h1 .Kind{
    background:linear-gradient(135deg,#fff 30%,var(--primary-red) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.gallery-header h1 .w-text{
    color:var(--primary-red);
}

.gallery-header h1 .in-text{
    color:#fff;
}

.gallery-header p{
    color:var(--text-muted);
    font-size:clamp(.8rem,2vw,1rem);
    letter-spacing:2px;
    text-transform:uppercase;
}

/* GALLERY */

.gallery-container{
    width:100%;
    max-width:1300px;

    margin:auto;

    padding:20px 5% 100px;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

    gap:35px;

    animation:fadeInUp 1s ease;

    position:relative;
    z-index:10;
}

.gallery-item{
    background:var(--dark-card);

    backdrop-filter:blur(16px);

    border-radius:24px;

    overflow:hidden;

    cursor:pointer;

    transition:0.4s ease;

    border:1px solid rgba(255,255,255,0.04);

    box-shadow:
    0 15px 35px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.gallery-item:hover{
    transform:translateY(-8px);

    border-color:var(--border-glow);
}

/* MEDIA */

.media-preview{
    position:relative;

    width:100%;
    height:220px;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#0f0f0f;
}

.audio-bg,
.drive-bg{
    width:100%;
    height:100%;

    background:linear-gradient(135deg,#121212 0%,#240404 100%);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.audio-bg i,
.drive-bg i{
    font-size:3.2rem;
    color:var(--primary-red);

    text-shadow:0 0 20px rgba(255,26,26,0.3);

    transition:0.3s ease;
}

.gallery-item:hover .audio-bg i,
.gallery-item:hover .drive-bg i{
    transform:scale(1.08);
}

/* OVERLAY */

.play-overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.5);

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:.45;

    transition:0.3s ease;
}

.gallery-item:hover .play-overlay{
    opacity:1;
    background:rgba(0,0,0,0.25);
}

.play-overlay i{
    font-size:3.5rem;
    color:#fff;

    text-shadow:0 0 25px rgba(255,26,26,0.8);

    transition:0.3s ease;
}

.gallery-item:hover .play-overlay i{
    transform:scale(1.15);
}

/* DETAILS */

.item-details{
    padding:24px;
    text-align:center;
}

.item-details h3{
    font-family:'Montserrat',sans-serif;
    font-size:1.15rem;
    line-height:1.5;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;

    z-index:2000;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(4,4,4,0.85);

    backdrop-filter:blur(15px);

    opacity:0;
    pointer-events:none;

    transition:0.4s ease;
}

.modal.active{
    opacity:1;
    pointer-events:auto;
}

.modal-container{
    width:100%;
    max-width:1000px;

    max-height:95vh;

    overflow:hidden;

    background:rgba(15,15,15,0.9);

    border-radius:24px;

    border:1px solid rgba(255,255,255,0.06);

    box-shadow:
    0 25px 50px rgba(0,0,0,0.6),
    0 0 40px rgba(255,26,26,0.1);

    transform:scale(.92);

    transition:0.4s ease;

    display:flex;
    flex-direction:column;
}

.modal.active .modal-container{
    transform:scale(1);
}

/* MODAL HEADER */

.modal-header-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    padding:18px 22px;

    background:rgba(20,20,20,0.6);

    border-bottom:1px solid rgba(255,255,255,0.05);
}

.modal-meta-title{
    min-width:0;
}

.modal-meta-title span{
    display:block;

    color:var(--primary-red);

    font-size:.72rem;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-bottom:3px;
}

.modal-meta-title h4{
    font-family:'Montserrat',sans-serif;
    font-size:1.1rem;

    line-height:1.4;

    word-break:break-word;
}

.modal-close-btn{
    flex-shrink:0;

    width:38px;
    height:38px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    background:rgba(255,255,255,0.05);

    color:#fff;

    font-size:1.3rem;

    transition:0.3s ease;
}

.modal-close-btn:hover{
    background:var(--primary-red);
    transform:rotate(90deg);
}

/* MODAL BODY */

.modal-body{
    position:relative;

    width:100%;

    overflow:auto;

    background:#090909;

    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-loader{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:var(--primary-red);

    font-size:2.8rem;

    z-index:5;
}

.modal-content{
    width:100%;
    opacity:0;
    transition:0.4s ease;
}

.modal-content.loaded{
    opacity:1;
}

/* MODAL MEDIA */

.modal-content img{
    width:100%;
    max-height:78vh;
    object-fit:contain;
    display:block;
}

.modal-content video{
    width:100%;
    max-height:78vh;
    display:block;
    background:#000;
}

.drive-iframe-container{
    width:100%;
    height:78vh;
}

.drive-iframe-container iframe{
    width:100%;
    height:100%;
    border:none;
}

/* AUDIO */

.audio-player-container{
    width:100%;

    padding:60px 30px;

    text-align:center;

    background:linear-gradient(135deg,#0d0d0d,#1a0505);
}

.audio-player-container h2{
    font-family:'Montserrat',sans-serif;
    font-size:1.5rem;

    margin-bottom:25px;
}

.audio-player-container audio{
    width:100%;
    max-width:550px;
}

/* WHATSAPP */

.whatsapp-float{
    position:fixed;
    right:24px;
    bottom:24px;

    width:56px;
    height:56px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#25d366;

    color:#fff;

    font-size:28px;

    text-decoration:none;

    z-index:999;

    box-shadow:0 8px 25px rgba(37,211,102,0.3);

    transition:0.3s ease;
}

.whatsapp-float:hover{
    transform:scale(1.12) rotate(12deg);
}

/* FOOTER */

footer{
    text-align:center;

    padding:50px 20px;

    background:#030303;

    border-top:1px solid rgba(255,255,255,0.03);
}

.social-icons{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;

    gap:15px;

    margin-bottom:25px;
}

.social-icons a{
    width:42px;
    height:42px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    text-decoration:none;

    color:var(--text-muted);

    background:rgba(255,255,255,0.03);

    border:1px solid rgba(255,255,255,0.05);

    transition:0.3s ease;
}

.social-icons a:hover{
    background:var(--primary-red);
    color:#fff;
    transform:translateY(-4px);
}

footer p{
    color:#666;
    font-size:.85rem;
    margin-bottom:5px;
}

/* ANIMATION */

@keyframes fadeInDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* TABLET */

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:14px;
        padding:15px 5%;
    }

    .nav-links{
        gap:20px;
    }

    .gallery-header{
        padding-top:190px;
        padding-bottom:45px;
    }

    .gallery-container{
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:22px;
    }

    .modal{
        padding:12px;
    }

    .modal-container{
        border-radius:18px;
    }

    .drive-iframe-container{
        height:60vh;
    }

}

/* MOBILE */

@media(max-width:520px){

    .nav-links{
        gap:15px;
    }

    .nav-links a{
        font-size:.85rem;
    }

    .gallery-header h1{
        font-size:1.9rem;
    }

    .gallery-header p{
        font-size:.82rem;
        letter-spacing:1px;
    }

    .gallery-container{
        grid-template-columns:1fr;
        padding-bottom:80px;
    }

    .media-preview{
        height:190px;
    }

    .item-details{
        padding:18px;
    }

    .item-details h3{
        font-size:1rem;
    }

    .modal-header-bar{
        padding:14px;
    }

    .modal-meta-title span{
        font-size:.62rem;
        letter-spacing:1px;
    }

    .modal-meta-title h4{
        font-size:.88rem;
    }

    .modal-close-btn{
        width:32px;
        height:32px;
        font-size:1.1rem;
    }

    .drive-iframe-container{
        height:50vh;
    }

    .audio-player-container{
        padding:40px 20px;
    }

    .audio-player-container h2{
        font-size:1.15rem;
    }

    .whatsapp-float{
        width:50px;
        height:50px;
        font-size:24px;
        right:18px;
        bottom:18px;
    }

}

/* EXTRA SMALL */

@media(max-width:360px){

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:.8rem;
    }

    .gallery-header h1{
        font-size:1.6rem;
    }

}

</style>
</head>

<body>

<nav>

    <a href="index.html" class="nav-logo-link">
        <img src="logo.jpeg" alt="K-WIN Icon" class="nav-logo-img">
    </a>

    <div class="nav-links">
        <a href="./">Home</a>
        <a href="gallery" class="active">Gallery</a>
        <a href="booking">Booking</a>
        <a href="about">About</a>
    </div>

</nav>

<section class="gallery-header">

    <h1>
        <span class="Kind">Kind</span>
        <span class="w-text">W</span><span>in
        Media Gallery
    </h1>

    <p>Explore our creations and professional productions</p>

</section>

<main class="gallery-container">

    <div class="gallery-item"
    data-category="Photos"
    data-type="drive"
    data-src="https://drive.google.com/embeddedfolderview?id=1lnazTNgyzJMry6cROmOudn5drW_UuKqY#grid">

        <div class="media-preview">

            <div class="drive-bg">
                <i class="fas fa-images"></i>
            </div>

            <div class="play-overlay">
                <i class="fas fa-folder-open"></i>
            </div>

        </div>

        <div class="item-details">
            <h3>K-WIN Photo Editing Projects</h3>
        </div>

    </div>

    <div class="gallery-item"
    data-category="Videos"
    data-type="drive"
    data-src="https://drive.google.com/embeddedfolderview?id=1yTeZ1XvrIdVYYMKaYzyj_pP4FVAZW2Nn#grid">

        <div class="media-preview">

            <div class="drive-bg">
                <i class="fas fa-video"></i>
            </div>

            <div class="play-overlay">
                <i class="fas fa-folder-open"></i>
            </div>

        </div>

        <div class="item-details">
            <h3>K-WIN Video Projects</h3>
        </div>

    </div>

    <div class="gallery-item"
    data-category="Audios"
    data-type="drive"
    data-src="https://drive.google.com/embeddedfolderview?id=1tEYXbzxEWIPRHW2FepMoBBxfHKWv-tbb#grid">

        <div class="media-preview">

            <div class="audio-bg">
                <i class="fas fa-music"></i>
            </div>

            <div class="play-overlay">
                <i class="fas fa-headphones"></i>
            </div>

        </div>

        <div class="item-details">
            <h3>Audio Track Editing</h3>
        </div>

    </div>

</main>

<div class="modal" id="mediaModal">

    <div class="modal-container">

        <div class="modal-header-bar">

            <div class="modal-meta-title">
                <span id="modalCategoryTag">Category</span>
                <h4 id="modalProjectTitle">Project Title</h4>
            </div>

            <button class="modal-close-btn" onclick="closeModal()">
                &times;
            </button>

        </div>

        <div class="modal-body">

            <div class="modal-loader" id="modalLoader">
                <i class="fas fa-circle-notch fa-spin"></i>
            </div>

            <div class="modal-content" id="modalContent"></div>

        </div>

    </div>

</div>

<a class="whatsapp-float"
href="https://wa.me/94707140731"
target="_blank">

<i class="fab fa-whatsapp"></i>

</a>

<footer>

    <div class="social-icons">

        <a href="https://www.facebook.com/share/18idSjuDgj/" target="_blank">
            <i class="fab fa-facebook-f"></i>
        </a>

        <a href="https://youtube.com/@kindwin_18?si=-2pV4FCG4Lh8Q9S1" target="_blank">
            <i class="fab fa-youtube"></i>
        </a>

        <a href="#" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

    </div>

    <p>© 2026 K-WIN Productions</p>
    <p>Kurunegala, Sri Lanka</p>

</footer>

<script>

const modal = document.getElementById('mediaModal');
const modalContent = document.getElementById('modalContent');
const modalLoader = document.getElementById('modalLoader');
const modalCategoryTag = document.getElementById('modalCategoryTag');
const modalProjectTitle = document.getElementById('modalProjectTitle');

document.querySelectorAll('.gallery-item').forEach(item=>{

    item.addEventListener('click',()=>{

        const type = item.dataset.type;
        const src = item.dataset.src;
        const category = item.dataset.category;
        const title = item.querySelector('h3').innerText;

        modalLoader.style.display='block';

        modalContent.innerHTML='';
        modalContent.classList.remove('loaded');

        modalCategoryTag.innerText=`K-WIN Production • ${category}`;
        modalProjectTitle.innerText=title;

        if(type==='drive'){

            modalContent.innerHTML=`
            <div class="drive-iframe-container">
                <iframe src="${src}" id="mediaTarget"></iframe>
            </div>`;

        }

        modal.classList.add('active');

        const target=document.getElementById('mediaTarget');

        if(target){

            target.onload=()=>{

                modalLoader.style.display='none';

                modalContent.classList.add('loaded');

            };

        }

    });

});

function closeModal(){

    modal.classList.remove('active');

    setTimeout(()=>{

        modalContent.innerHTML='';

        modalContent.classList.remove('loaded');

    },300);

}

window.addEventListener('click',(e)=>{

    if(e.target===modal){

        closeModal();

    }

});

</script>

</body>
</html>
