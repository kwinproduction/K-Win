<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-WIN</title> 
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50%' y='65%' font-size='55' font-family='Montserrat, sans-serif' font-weight='800' text-anchor='middle' fill='%23ffffff'>K<tspan fill='%23ff1a1a'>W</tspan></text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #ff1a1a;
            --primary-red-glow: rgba(255, 26, 26, 0.5);
            --dark-bg: #0a0a0a;
            --dark-card: #141414;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* NAVIGATION BAR (MATCHES HOME PAGE) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-logo-img {
            height: 45px;
            width: auto;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary-red);
        }

        /* GALLERY HEADER */
        .gallery-header {
            text-align: center;
            padding: 160px 20px 40px;
            background: linear-gradient(rgba(10, 10, 10, 0.5), var(--dark-bg));
        }

        .gallery-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 1px;
            animation: fadeInDown 0.8s ease;
        }

        .gallery-header h1 span { 
            color: var(--primary-red); 
            text-shadow: 0 0 20px var(--primary-red-glow);
        }

        .gallery-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* GALLERY GRID */
        .gallery-container {
            max-width: 1300px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px 8% 100px 8%;
            animation: fadeInUp 1s ease;
        }

        .gallery-item {
            background: var(--dark-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 26, 26, 0.2);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        /* CARD MEDIA PREVIEWS */
        .media-preview {
            position: relative;
            width: 100%;
            height: 220px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Overlay Icons for Video/Audio */
        .play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.6;
            transition: all 0.3s ease;
            backdrop-filter: blur(1px);
        }

        .gallery-item:hover .play-overlay {
            opacity: 1;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(0px);
        }

        .play-overlay i {
            font-size: 3.8rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 26, 26, 0.7);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .play-overlay i {
            transform: scale(1.1);
        }

        /* Audio & Drive specific preview card style */
        .audio-bg, .drive-bg {
            background: linear-gradient(135deg, #161616, #2d0505);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .audio-bg i, .drive-bg i {
            font-size: 3.5rem;
            color: var(--primary-red);
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.3);
        }

        /* CARD DETAILS */
        .item-details {
            padding: 24px;
            text-align: center;
            background: var(--dark-card);
        }

        .item-details h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }

        /* NEW PREMIUM POPUP LIGHTBOX MODAL */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
            backdrop-filter: blur(15px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            position: relative;
            max-width: 1000px;
            width: 100%;
            background: #111111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 26, 26, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: scale(0.93);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
        }

        .modal.active .modal-container {
            transform: scale(1);
        }

        /* Dynamic Modal Header Bar */
        .modal-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            background: rgba(20, 20, 20, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-meta-title h4 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .modal-meta-title span {
            font-size: 0.72rem;
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .modal-close-btn:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
            box-shadow: 0 0 15px var(--primary-red-glow);
            transform: rotate(90deg);
        }

        /* Modal Body Wrap */
        .modal-body {
            position: relative;
            width: 100%;
            background: #0d0d0d;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Modern Spinner Animation */
        .modal-loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary-red);
            font-size: 2.8rem;
            z-index: 5;
            text-shadow: 0 0 20px var(--primary-red-glow);
        }

        .modal-content {
            width: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-content.loaded {
            opacity: 1;
        }

        /* Modal Internals Styling */
        .modal-content img {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            display: block;
        }

        .modal-content video {
            width: 100%;
            max-height: 75vh;
            background: #000;
            display: block;
            outline: none;
        }

        /* Google Drive Embedded Folder Container Style */
        .drive-iframe-container {
            width: 100%;
            height: 75vh;
            background: #111;
        }

        .drive-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .audio-player-container {
            padding: 60px 40px;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #111, #1a0505);
        }

        .audio-player-container h2 {
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #fff;
        }

        .audio-player-container audio {
            width: 100%;
            max-width: 550px;
            margin-top: 10px;
            outline: none;
        }

        /* FLOATING WHATSAPP BUTTON */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 60px 20px;
            background: #050505;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-icons a {
            color: var(--text-muted);
            font-size: 1.3rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--dark-card);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-icons a:hover {
            color: #fff;
            background: var(--primary-red);
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(255, 26, 26, 0.3);
        }

        footer p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 768px) {
            nav { padding: 15px 5%; flex-direction: column; gap: 15px; text-align: center; }
            .gallery-header { padding-top: 190px; }
            .gallery-header h1 { font-size: 2.3rem; }
            .gallery-container { padding: 10px 5% 80px 5%; gap: 20px; }
            .drive-iframe-container { height: 60vh; }
            .modal-container { width: 95%; }
            .modal-header-bar { padding: 15px; }
            .modal-meta-title h4 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="nav-logo-link">
            <img src="logo.jpeg" alt="K-WIN Icon" class="nav-logo-img">
        </a>
        <div class="nav-links">
            <a href="index">Home</a>
            <a href="gallery" class="active">Gallery</a>
            <a href="booking">Booking</a>
            <a href="about">About</a>
        </div>
    </nav>

    <!-- GALLERY HEADER SECTION -->
    <section class="gallery-header">
    <h1><span class="Kind text"> Kind </span><span class="w-text"> W</span><span class="in-text">in</span></h1> Media Gallery</h1>
        <p>Explore our creations and professional productions</p> 
    </section>

    <!-- GALLERY GRID CONTAINER -->
    <main class="gallery-container">

        <!-- DYNAMIC GOOGLE DRIVE PHOTOS CARD -->
        <div class="gallery-item" data-category="Photos" data-type="drive" data-src="https://drive.google.com/embeddedfolderview?id=1lnazTNgyzJMry6cROmOudn5drW_UuKqY#grid">
            <div class="media-preview">
                <div class="drive-bg">
                    <i class="fas fa-images"></i>
                </div>
                <div class="play-overlay">
                    <i class="fas fa-folder-open"></i>
                </div>
            </div>
            <div class="item-details">
                <h3>K-WIN Photo Editing Projects</h3>
            </div>
        </div>

        <!-- DYNAMIC GOOGLE DRIVE VIDEOS CARD -->
        <div class="gallery-item" data-category="Videos" data-type="drive" data-src="https://drive.google.com/embeddedfolderview?id=1yTeZ1XvrIdVYYMKaYzyj_pP4FVAZW2Nn#grid">
            <div class="media-preview">
                <div class="drive-bg">
                    <i class="fas fa-video"></i>
                </div>
                <div class="play-overlay">
                    <i class="fas fa-folder-open"></i>
                </div>
            </div>
            <div class="item-details">
                <h3>K-WIN Video Projects</h3>
            </div>
        </div>

        <!-- AUDIO CARD  -->
        <div class="gallery-item" data-category="Audios" data-type="drive" data-src="https://drive.google.com/embeddedfolderview?id=1tEYXbzxEWIPRHW2FepMoBBxfHKWv-tbb#grid">
            <div class="media-preview">
                <div class="audio-bg">
                    <i class="fas fa-music"></i>
                </div>
                <div class="play-overlay">
                    <i class="fas fa-headphones"></i>
                </div>
            </div>
            <div class="item-details">
                <h3>Audio Track Editing</h3>
            </div>
        </div>
    </main>

    <!-- ENHANCED POPUP LIGHTBOX MODAL CONTAINER -->
    <div class="modal" id="mediaModal">
        <div class="modal-container">
            <!-- Dynamic Header Bar inside popup -->
            <div class="modal-header-bar">
                <div class="modal-meta-title">
                    <span id="modalCategoryTag">Category</span>
                    <h4 id="modalProjectTitle">Project Title</h4>
                </div>
                <button class="modal-close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <!-- Content Wrapper with Loader -->
            <div class="modal-body">
                <div class="modal-loader" id="modalLoader">
                    <i class="fas fa-circle-notch fa-spin"></i>
                </div>
                <div class="modal-content" id="modalContent">
                    <!-- Loaded dynamically via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING WHATSAPP BUTTON -->
    <a class="whatsapp-float" href="https://wa.me/94707140731" target="_blank" aria-label="Contact on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- FOOTER -->
    <footer>
        <div class="social-icons">
            <a href="https://www.facebook.com/share/18idSjuDgj/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://youtube.com/@kindwin_18?si=-2pV4FCG4Lh8Q9S1" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
        <p>© 2026 K-WIN Productions</p>
        <p>Kurunegala, Sri Lanka</p>
    </footer>

    <!-- JAVASCRIPT LOGIC CODE -->
    <script>
        // LIGHTBOX MODAL CONTROLLER SYSTEM
        const modal = document.getElementById('mediaModal');
        const modalContent = document.getElementById('modalContent');
        const modalLoader = document.getElementById('modalLoader');
        const modalCategoryTag = document.getElementById('modalCategoryTag');
        const modalProjectTitle = document.getElementById('modalProjectTitle');
        const galleryItems = document.querySelectorAll('.gallery-item');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const type = item.getAttribute('data-type');
                const src = item.getAttribute('data-src');
                const category = item.getAttribute('data-category');
                const title = item.querySelector('h3').innerText;
                
                // Reset states
                modalContent.classList.remove('loaded');
                modalLoader.style.display = 'block';
                modalContent.innerHTML = ''; 

                // Inject texts into modern header bar
                modalCategoryTag.innerText = `K-WIN Production • ${category}`;
                modalProjectTitle.innerText = title;

                // Load appropriate content markup
                if (type === 'photo') {
                    modalContent.innerHTML = `<img src="${src}" alt="Project Content" id="mediaTarget">`;
                } 
                else if (type === 'video') {
                    modalContent.innerHTML = `
                        <video controls autoplay id="mediaTarget">
                            <source src="${src}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    `;
                } 
                else if (type === 'audio') {
                    modalContent.innerHTML = `
                        <div class="audio-player-container">
                            <i class="fas fa-compact-disc fa-spin" style="font-size: 4.5rem; color: var(--primary-red); margin-bottom:20px; text-shadow: 0 0 20px rgba(255,26,26,0.4);"></i>
                            <h2>${title}</h2>
                            <audio controls autoplay id="mediaTarget">
                                <source src="${src}" type="audio/mp3">
                                Your browser does not support the audio element.
                            </audio>
                        </div>
                    `;
                }
                else if (type === 'drive') {
                    modalContent.innerHTML = `
                        <div class="drive-iframe-container">
                            <iframe src="${src}" allow="autoplay" id="mediaTarget"></iframe>
                        </div>
                    `;
                }

                // Show modal window
                modal.classList.add('active');

                // Media load listener to hide spinner gracefully
                const target = document.getElementById('mediaTarget');
                if (target) {
                    if (target.tagName === 'IFRAME' || target.tagName === 'IMG') {
                        target.onload = () => {
                            modalLoader.style.display = 'none';
                            modalContent.classList.add('loaded');
                        };
                    } else if (target.tagName === 'VIDEO' || target.tagName === 'AUDIO') {
                        target.onloadeddata = () => {
                            modalLoader.style.display = 'none';
                            modalContent.classList.add('loaded');
                        };
                    }
                } else {
                    modalLoader.style.display = 'none';
                    modalContent.classList.add('loaded');
                }
            });
        });

        // CLOSE MODAL INTERACTION
        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                modalContent.innerHTML = '';
                modalContent.classList.remove('loaded');
            }, 350);
        }

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
