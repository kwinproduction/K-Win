<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-WIN </title>
    
    <!-- Dynamic SVG Web Icon (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50%' y='65%' font-size='55' font-family='Montserrat, sans-serif' font-weight='800' text-anchor='middle' fill='%23ffffff'>K<tspan fill='%23ff1a1a'>W</tspan></text></svg>">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #ff1a1a;
            --primary-red-glow: rgba(255, 26, 26, 0.5);
            --dark-bg: #0a0a0a;
            --dark-card: #141414;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.8;
        }

        /* SCROLLBAR STYLE */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-red), #b30000);
            border-radius: 10px;
        }

        /* NAVIGATION BAR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-logo-img {
            height: 45px;
            width: auto;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary-red);
        }

        /* HERO HEADER SECTION */
        header {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 150px 20px 60px 20px;
            background: linear-gradient(rgba(10, 10, 10, 0.7), var(--dark-bg)),
            url('https://images.unsplash.com/photo-1598653222000-6b7b7a552625?auto=format&fit=crop&q=80&w=1600');
            background-size: cover;
            background-position: center;
        }

        .main-logo {
            width: 150px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInDown 0.8s ease;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 5px;
        }

        header h1 span {
            color: var(--primary-red);
            text-shadow: 0 0 25px var(--primary-red-glow);
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ================= SERVICES CONTAINER ================= */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--dark-card);
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 26, 26, 0.3);
            background: rgba(255, 26, 26, 0.02);
            box-shadow: 0 10px 25px rgba(255, 26, 26, 0.05);
        }

        .card h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #fff;
        }

        button {
            background: var(--primary-red);
            border: none;
            padding: 12px 24px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 26, 26, 0.3);
        }

        button:hover {
            background: #e60000;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 26, 26, 0.5);
        }

        /* ================= MODAL ================= */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-box {
            background: #111;
            padding: 35px;
            border-radius: 18px;
            width: 400px;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .modal-box h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* FLOATING WHATSAPP BUTTON */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 1500;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 60px 20px;
            background: #050505;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 40px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-icons a {
            color: var(--text-muted);
            font-size: 1.3rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--dark-card);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-icons a:hover {
            color: #fff;
            background: var(--primary-red);
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(255, 26, 26, 0.3);
        }

        footer p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        /* ANIMATION KEY */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            nav { padding: 15px 5%; flex-direction: column; gap: 12px; text-align: center; }
            header { padding-top: 180px; min-height: auto; }
            header h1 { font-size: 2.8rem; }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html" class="nav-logo-link">
            <img src="logo.jpeg" alt="K-WIN Icon" class="nav-logo-img">
        </a>
        <div class="nav-links">
            <a href="./">Home</a>
            <a href="gallery">Gallery</a>
            <a href="booking" class="active">Booking</a>
            <a href="about">About</a>
        </div>
    </nav>

    <!-- HERO HEADER SECTION -->
    <header>
        <div>
            <img src="logo.jpeg" class="main-logo" alt="K-WIN Logo">
        </div>
        <h1><span>Kind</span> Win</h1>
        <p>Book Any Digital Service Easily</p>
    </header>

    <!-- SERVICES CONTAINER -->
    <main class="container">

        <div class="card">
            <h3>Social Media</h3>
            <button onclick="openModal('Social Media')">Book Now</button>
        </div>

        <div class="card">
            <h3>Data Recovery</h3>
            <button onclick="openModal('Data Recovery')">Book Now</button>
        </div>

        <div class="card">
            <h3>Audio Editing</h3>
            <button onclick="openModal('Audio Editing')">Book Now</button>
        </div>

        <div class="card">
            <h3>All Campaigns</h3>
            <button onclick="openModal('All Campaigns')">Book Now</button>
        </div>

        <div class="card">
            <h3>Business Promotion</h3>
            <button onclick="openModal('Business Promotion')">Book Now</button>
        </div>

    </main>

    <!-- MODAL POPUP -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <h3 id="title">Book Service</h3>

            <input id="name" placeholder="Name">
            <input id="email" placeholder="Email">
            <input type="date" id="date" onchange="loadSlots()">

            <select id="time" disabled>
                <option>Select Date First</option>
            </select>

            <!-- NEW FIELD: REGARDING WHAT / DETAILS -->
            <input id="details" placeholder="Regarding What? (eg: Song Editing, Page Promo)">

            <div class="modal-buttons">
                <button onclick="bookNow()">Confirm Booking</button>
                <button onclick="closeModal()" style="background:#444; box-shadow: none;">Close</button>
            </div>
        </div>
    </div>

    <!-- FLOATING WHATSAPP BUTTON -->
    <a class="whatsapp-float" href="https://wa.me/94707140731" target="_blank" aria-label="Contact on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- FOOTER -->
    <footer>
        <div class="social-icons">
            <a href="https://www.facebook.com/share/18idSjuDgj/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://youtube.com/@kindwin_18?si=-2pV4FCG4Lh8Q9S1" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
        <p>© 2026 K-WIN Productions</p>
        <p>Kurunegala, Sri Lanka</p>
    </footer>

<script>
// 🔥 GOOGLE SCRIPT URL
const URL = "https://script.google.com/macros/s/AKfycbzc5JueQoCCw6i6DmRqLV5V8sFtP2q1FlFYVWgAkiyyY2dE_3u7tdta5g-RB6RUwD5tjQ/exec";

let selectedService = "";

// OPEN MODAL
function openModal(service){
    selectedService = service;
    document.getElementById("title").innerText = "Book: " + service;
    document.getElementById("modal").style.display = "flex";
}

// CLOSE MODAL
function closeModal(){
    document.getElementById("modal").style.display = "none";
    document.getElementById("details").value = ""; // Reset details field
}

// LOAD SLOTS
async function loadSlots(){
    const date = document.getElementById("date").value;
    const timeSelect = document.getElementById("time");

    timeSelect.disabled = true;
    timeSelect.innerHTML = "Loading...";

    const res = await fetch(URL + "?action=slots&date=" + date);
    const data = await res.json();

    const slots = ["08:00","09:30","12:00","14:30","16:00"];

    let html = "";

    slots.forEach(s=>{
        html += data.booked.includes(s)
        ? `<option disabled>${s} - Booked</option>`
        : `<option value="${s}">${s}</option>`;
    });

    timeSelect.innerHTML = html;
    timeSelect.disabled = false;
}

// BOOK NOW
async function bookNow(){
    const nameVal = document.getElementById("name").value;
    const emailVal = document.getElementById("email").value;
    const dateVal = document.getElementById("date").value;
    const timeVal = document.getElementById("time").value;
    const detailsVal = document.getElementById("details").value || "Not Specified";

    const payload = {
        service: selectedService,
        name: nameVal,
        email: emailVal,
        date: dateVal,
        time: timeVal,
        details: detailsVal
    };

    const res = await fetch(URL,{
        method:"POST",
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.result === "success"){
        // 📌 Generating a Premium Unique Reference Number (e.g., KW-B84A2)
        const refNum = "KW-" + Math.random().toString(36).substring(2, 7).toUpperCase();

        // 🌟 Styled WhatsApp Message with the New "Regarding / Details" section
        const msg = 
`🔥 *NEW BOOKING CONFIRMED* 🔥

📌 *Ref No:* ${refNum}
🛠️ *Service:* ${payload.service}
📝 *Regarding:* ${payload.details}
👤 *Client Name:* ${payload.name}
📅 *Date:* ${payload.date}
⏰ *Time Slot:* ${payload.time}

----------------------------------
Thank you for choosing K-WIN Productions!`;

        window.open("https://wa.me/94707140731?text=" + encodeURIComponent(msg));

        alert("Booking Successful ✔️\nYour Reference Number: " + refNum + "\nRegarding: " + payload.details);
        closeModal();

    } else if(data.result === "taken"){
        alert("Slot already booked!");
        loadSlots();
    } else {
        alert("Error!");
    }
}
</script>

</body>
</html>
