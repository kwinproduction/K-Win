<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-WIN Productions</title>

<!-- 🔥 FAVICON (Browser Logo) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<rect width='100' height='100' rx='20' fill='%230a0a0a'/>
<text x='50%' y='65%' font-size='55' font-family='Arial'
text-anchor='middle' fill='white'>K<tspan fill='%23ff1a1a'>W</tspan></text>
</svg>">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ================= GLOBAL ================= */
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
}

/* ================= NAV ================= */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    background:#0a0a0a;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:10;
}

nav img{
    height:45px;
    border-radius:8px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    margin-left:20px;
}

nav a:hover{
    color:#ff1a1a;
}

/* ================= HERO ================= */
.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1 span{
    color:#ff1a1a;
}

/* ================= SERVICES ================= */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#141414;
    padding:20px;
    border-radius:12px;
    text-align:center;
    border:1px solid #222;
}

button{
    background:#ff1a1a;
    border:none;
    padding:10px 18px;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* ================= MODAL ================= */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:#111;
    padding:25px;
    border-radius:12px;
    width:350px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    background:#000;
    border:1px solid #333;
    color:white;
    border-radius:6px;
}

/* ================= FOOTER ================= */
footer{
    background:#050505;
    text-align:center;
    padding:40px;
    border-top:1px solid #222;
    margin-top:40px;
}

footer span{
    color:#ff1a1a;
}

.social a{
    color:#aaa;
    margin:0 10px;
    text-decoration:none;
}

.social a:hover{
    color:#ff1a1a;
}

small{
    color:#666;
}

</style>
</head>

<body>

<!-- ================= NAV ================= -->
<nav>
    <a href="#">
        <img src="logo.png" alt="K-WIN Logo">
    </a>

    <div>
        <a href="./">Home</a>
        <a href="gallery">Gallery</a>
        <a href="booking">Booking</a>
        <a href="about">About </a>
    </div>
</nav>

<!-- ================= HERO ================= -->
<div class="hero">
    <h1>Kind Win </span></h1>
    <p>Book Any Digital Service Easily</p>
</div>

<!-- ================= SERVICES ================= -->
<div class="container">

    <div class="card">
        <h3>Social Media</h3>
        <button onclick="openModal('Social Media')">Book Now</button>
    </div>

    <div class="card">
        <h3>Data Recovery</h3>
        <button onclick="openModal('Data Recovery')">Book Now</button>
    </div>

    <div class="card">
        <h3>Audio Editing</h3>
        <button onclick="openModal('Audio Editing')">Book Now</button>
    </div>

    <div class="card">
        <h3>All Campaigns</h3>
        <button onclick="openModal('All Campaigns')">Book Now</button>
    </div>

    <div class="card">
        <h3>Business Promotion</h3>
        <button onclick="openModal('Business Promotion')">Book Now</button>
    </div>

</div>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
<div class="modal-box">

<h3 id="title">Book Service</h3>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">

<input type="date" id="date" onchange="loadSlots()">

<select id="time" disabled>
<option>Select Date First</option>
</select>

<button onclick="bookNow()">Confirm Booking</button>
<button onclick="closeModal()" style="background:#444;">Close</button>

</div>
</div>

<!-- ================= FOOTER ================= -->
<footer>
<div class="social">
    <a href="https://facebook.com">Facebook</a>
    <a href="https://youtube.com">YouTube</a>
    <a href="https://wa.me/94707140731">WhatsApp</a>
</div>

<small>© 2026 K-WIN Productions. All Rights Reserved.</small>

</footer>

<script>

// 🔥 GOOGLE SCRIPT URL
const URL = "https://script.google.com/macros/s/AKfycbzc5JueQoCCw6i6DmRqLV5V8sFtP2q1FlFYVWgAkiyyY2dE_3u7tdta5g-RB6RUwD5tjQ/exec";

let selectedService = "";

// OPEN MODAL
function openModal(service){
    selectedService = service;
    document.getElementById("title").innerText = "Book: " + service;
    document.getElementById("modal").style.display = "flex";
}

// CLOSE MODAL
function closeModal(){
    document.getElementById("modal").style.display = "none";
}

// LOAD SLOTS
async function loadSlots(){

    const date = document.getElementById("date").value;
    const timeSelect = document.getElementById("time");

    timeSelect.disabled = true;
    timeSelect.innerHTML = "Loading...";

    const res = await fetch(URL + "?action=slots&date=" + date);
    const data = await res.json();

    const slots = ["08:00","09:30","12:00","14:30","16:00"];

    let html = "";

    slots.forEach(s=>{
        html += data.booked.includes(s)
        ? `<option disabled>${s} - Booked</option>`
        : `<option value="${s}">${s}</option>`;
    });

    timeSelect.innerHTML = html;
    timeSelect.disabled = false;
}

// BOOK NOW
async function bookNow(){

    const payload = {
        service: selectedService,
        name: name.value,
        email: email.value,
        date: date.value,
        time: time.value
    };

    const res = await fetch(URL,{
        method:"POST",
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.result === "success"){

        const msg =
`NEW BOOKING
Service: ${payload.service}
Name: ${payload.name}
Date: ${payload.date}
Time: ${payload.time}`;

        window.open("https://wa.me/94707140731?text=" + encodeURIComponent(msg));

        alert("Booking Successful ✔️");
        closeModal();

    } else if(data.result === "taken"){
        alert("Slot already booked!");
        loadSlots();
    } else {
        alert("Error!");
    }
}

</script>

</body>
</html>
