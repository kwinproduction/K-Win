<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-WIN Booking System</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body{
    font-family: Arial;
    background:#0a0a0a;
    color:white;
    margin:0;
}

/* HEADER */
.header{
    text-align:center;
    padding:40px 20px;
}

.header h1{
    margin:0;
}

.header span{
    color:#ff1a1a;
}

/* SERVICE GRID */
.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#141414;
    padding:20px;
    border-radius:12px;
    text-align:center;
    border:1px solid #222;
}

.card h3{
    margin-bottom:10px;
}

button{
    background:#ff1a1a;
    border:none;
    padding:10px 20px;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.8;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:#111;
    padding:25px;
    border-radius:12px;
    width:350px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    background:#000;
    border:1px solid #333;
    color:white;
    border-radius:6px;
}

/* FOOTER */
footer{
    background:#050505;
    padding:40px 20px;
    text-align:center;
    border-top:1px solid #222;
    margin-top:40px;
}

footer h2{
    margin-bottom:10px;
}

footer span{
    color:#ff1a1a;
}

.social{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px 0;
}

.social a{
    width:40px;
    height:40px;
    background:#141414;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#aaa;
    text-decoration:none;
}

.social a:hover{
    background:#ff1a1a;
    color:white;
    transform:scale(1.1);
    transition:0.3s;
}

small{
    color:#666;
}
</style>
</head>

<body>

<div class="header">
    <h1>K-WIN <span>Booking System</span></h1>
    <p>Book Any Service Easily</p>
</div>

<!-- SERVICES -->
<div class="container">

    <div class="card">
        <h3>Social Media</h3>
        <button onclick="openModal('Social Media')">Book Now</button>
    </div>

    <div class="card">
        <h3>Data Recovery</h3>
        <button onclick="openModal('Data Recovery')">Book Now</button>
    </div>

    <div class="card">
        <h3>Audio Editing</h3>
        <button onclick="openModal('Audio Editing')">Book Now</button>
    </div>

    <div class="card">
        <h3>Campaigns</h3>
        <button onclick="openModal('All Campaigns')">Book Now</button>
    </div>

    <div class="card">
        <h3>Business Promotion</h3>
        <button onclick="openModal('Business Promotion')">Book Now</button>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3 id="title">Book Service</h3>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">

<input type="date" id="date" onchange="loadSlots()">

<select id="time" disabled>
<option>Select Date First</option>
</select>

<button onclick="bookNow()">Confirm Booking</button>
<button onclick="closeModal()" style="background:#444;">Close</button>

</div>
</div>

<!-- FOOTER -->
<footer>

<h2>K-WIN <span>Productions</span></h2>
<p>The Trademark of Kind Win</p>

<div class="social">
    <a href="https://www.facebook.com/share/18idSjuDgj/" target="_blank"><i class="fab fa-facebook-f"></i></a>
    <a href="https://youtube.com/@kindwin_18?si=-2pV4FCG4Lh8Q9S1" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://wa.me/94707140731" target="_blank"><i class="fab fa-whatsapp"></i></a>
</div>

<small>© 2026 K-WIN Productions. All Rights Reserved.</small>

</footer>

<script>

// 🔥 GOOGLE SCRIPT URL
const URL = "https://script.google.com/macros/s/AKfycbzc5JueQoCCw6i6DmRqLV5V8sFtP2q1FlFYVWgAkiyyY2dE_3u7tdta5g-RB6RUwD5tjQ/exec";

let selectedService = "";

function openModal(service){
    selectedService = service;
    document.getElementById("title").innerText = "Book: " + service;
    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

async function loadSlots(){

    const date = document.getElementById("date").value;
    const timeSelect = document.getElementById("time");

    timeSelect.disabled = true;
    timeSelect.innerHTML = "Loading...";

    const res = await fetch(URL + "?action=slots&date=" + date);
    const data = await res.json();

    const slots = ["08:00","09:30","12:00","14:30","16:00"];

    let html = "";

    slots.forEach(s=>{
        const booked = data.booked.includes(s);

        html += booked
        ? `<option disabled>${s} - Booked</option>`
        : `<option value="${s}">${s}</option>`;
    });

    timeSelect.innerHTML = html;
    timeSelect.disabled = false;
}

async function bookNow(){

    const payload = {
        service: selectedService,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value
    };

    const res = await fetch(URL,{
        method:"POST",
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.result === "success"){

        const msg =
`NEW BOOKING
Service: ${payload.service}
Name: ${payload.name}
Date: ${payload.date}
Time: ${payload.time}`;

        window.open("https://wa.me/94707140731?text=" + encodeURIComponent(msg));

        alert("Booking Successful ✔️");
        closeModal();

    } else if(data.result === "taken"){
        alert("Slot already booked!");
        loadSlots();
    } else {
        alert("Error occurred!");
    }
}

</script>

</body>
</html>
