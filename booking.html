<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-WIN </title>

<!-- FAVICON -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<rect width='100' height='100' rx='20' fill='%230a0a0a'/>
<text x='50%' y='65%' font-size='55' font-family='Arial'
text-anchor='middle' fill='white'>K<tspan fill='%23ff1a1a'>W</tspan></text>
</svg>">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    background:#0a0a0a;
}

nav img{height:45px;}

nav a{
    color:#aaa;
    text-decoration:none;
    margin-left:15px;
}

nav a:hover{color:#ff1a1a;}

.hero{
    text-align:center;
    padding:50px 20px;
}

.hero h1 span{color:#ff1a1a;}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#141414;
    padding:20px;
    border-radius:12px;
    text-align:center;
    border:1px solid #222;
}

button{
    background:#ff1a1a;
    border:none;
    padding:10px 15px;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{opacity:0.8;}

.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:#111;
    padding:25px;
    border-radius:12px;
    width:350px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    background:#000;
    border:1px solid #333;
    color:white;
    border-radius:6px;
}

footer{
    background:#050505;
    text-align:center;
    padding:40px;
    border-top:1px solid #222;
    margin-top:40px;
}

footer span{color:#ff1a1a;}

.social a{
    color:#aaa;
    margin:0 10px;
    text-decoration:none;
}

.social a:hover{color:#ff1a1a;}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <img src="logo.png" alt="logo">

    <div>
        <a href="./">Home</a>
        <a href="gallery">Gallery</a>
        <a href="booking">Booking</a>
        <a href="about">About</a>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <h1>K-WIN <span>Productions</span></h1>
    <p>Book Any Service Easily</p>
</div>

<!-- SERVICES -->
<div class="container">

    <div class="card">
        <h3>Social Media</h3>
        <button onclick="openModal('Social Media')">Book</button>
    </div>

    <div class="card">
        <h3>Data Recovery</h3>
        <button onclick="openModal('Data Recovery')">Book</button>
    </div>

    <div class="card">
        <h3>Audio Editing</h3>
        <button onclick="openModal('Audio Editing')">Book</button>
    </div>

    <div class="card">
        <h3>All Campaigns</h3>
        <button onclick="openModal('All Campaigns')">Book</button>
    </div>

    <div class="card">
        <h3>Business Promotion</h3>
        <button onclick="openModal('Business Promotion')">Book</button>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3 id="title">Book Service</h3>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">

<input type="date" id="date" onchange="loadSlots()">

<select id="time" disabled>
<option>Select Date First</option>
</select>

<button onclick="bookNow()">Confirm Booking</button>
<button onclick="closeModal()" style="background:#444;">Close</button>

</div>
</div>

<!-- FOOTER -->
<footer>
<div class="social">
    <a href="https://facebook.com">Facebook</a>
    <a href="https://youtube.com">YouTube</a>
    <a href="https://wa.me/94707140731">WhatsApp</a>
</div>

<small>© 2026 K-WIN Productions. All Rights Reserved.</small>
</footer>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzc5JueQoCCw6i6DmRqLV5V8sFtP2q1FlFYVWgAkiyyY2dE_3u7tdta5g-RB6RUwD5tjQ/exec";

let selectedService = "";

/* OPEN */
function openModal(service){
    selectedService = service;
    document.getElementById("title").innerText = "Book: " + service;
    document.getElementById("modal").style.display = "flex";
}

/* CLOSE */
function closeModal(){
    document.getElementById("modal").style.display = "none";
}

/* LOAD SLOTS */
async function loadSlots(){

    const date = document.getElementById("date").value;
    const timeSelect = document.getElementById("time");

    if(!date){
        alert("Select date first");
        return;
    }

    timeSelect.disabled = true;
    timeSelect.innerHTML = "Loading...";

    try{

        const res = await fetch(URL + "?action=slots&date=" + date);
        const data = await res.json();

        const booked = data.booked || [];

        const slots = ["08:00","09:30","12:00","14:30","16:00"];

        let html = "";

        slots.forEach(s=>{
            html += booked.includes(s)
            ? `<option disabled>${s} - Booked</option>`
            : `<option value="${s}">${s}</option>`;
        });

        timeSelect.innerHTML = html;
        timeSelect.disabled = false;

    }catch(e){
        console.log(e);
        timeSelect.innerHTML = "<option>Error</option>";
    }
}

/* BOOK */
async function bookNow(){

    const payload = {
        service: selectedService,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value
    };

    if(!payload.name || !payload.email || !payload.date || !payload.time){
        alert("Fill all fields");
        return;
    }

    const res = await fetch(URL,{
        method:"POST",
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.result === "success"){

        const msg =
`NEW BOOKING
Service: ${payload.service}
Name: ${payload.name}
Date: ${payload.date}
Time: ${payload.time}`;

        window.open("https://wa.me/94707140731?text=" + encodeURIComponent(msg));

        alert("Booked Successfully ✔️");
        closeModal();

    } else if(data.result === "taken"){
        alert("Slot already booked!");
        loadSlots();
    } else {
        alert("Error");
    }
}

</script>

</body>
</html>
